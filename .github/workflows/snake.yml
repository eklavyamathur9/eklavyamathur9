name: Generate Snake Animation

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:        # Allows manual triggering

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate snake animation

    steps:
      - name: Generate GitHub Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_snake=#39FF14&color_dots=#001a00,#003300,#00802b,#00cc44,#39ff14
            dist/github-snake.gif?color_snake=#39FF14&color_dots=#001a00,#003300,#00802b,#00cc44,#39ff14

      - name: Commit and Push Snake Files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
